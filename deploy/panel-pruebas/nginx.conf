# Former test URL remains an entry point, never a plaintext admin login.
server {
    listen 9029;
    listen [::]:9029;
    server_name _;
    # Do not forward credentials submitted to the former plaintext login.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    return 302 https://kyber.com.py/pruebas/;
}
