# TEST environment only. Production 80/443 is untouched.
server {
    listen 9029;
    listen [::]:9029;
    server_name _;
    # Do not forward credentials submitted to the former plaintext login.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    return 302 https://kyber.com.py:8443/;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name kyber.com.py;
    ssl_certificate /etc/letsencrypt/live/kyber.com.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyber.com.py/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    location = /healthz { access_log off; return 200 "kyber-pruebas-ok\n"; }
    location ~ ^/panel-sync/(?<panel_company>ekaru|ejapo)/(?<panel_page>entrar|index\.php|sync\.php|configuracion\.php)$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/kyber/app-pruebas/sync/gateway.php;
        fastcgi_param HTTPS on;
        fastcgi_param KYBER_PANEL_COMPANY $panel_company;
        fastcgi_param KYBER_PANEL_PAGE $panel_page;
        fastcgi_pass unix:/run/kyber-panel-pruebas/php.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffering off;
        access_log off;
        client_max_body_size 16k;
    }
    # No raw PHP, configs, logs, directories or arbitrary scripts can be served.
    location /panel-sync/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
