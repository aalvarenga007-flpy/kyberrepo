[global]
pid = /run/kyber-panel-pruebas/php-fpm.pid
error_log = syslog
syslog.ident = kyber-panel-pruebas
daemonize = no

[kyber-panel-pruebas]
user = kyber
group = kyber
listen = /run/kyber-panel-pruebas/php.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 60s
clear_env = yes
env[AUTH_DATABASE] = $AUTH_DATABASE
env[AUTH_MYSQL_USER] = $AUTH_MYSQL_USER
env[AUTH_MYSQL_PASSWORD] = $AUTH_MYSQL_PASSWORD
env[KYBER_PANEL_STATE] = /var/lib/kyber-panel-pruebas
env[KYBER_PANEL_ORIGIN] = https://kyber.com.py
env[KYBER_PANEL_BASE_PATH] = /pruebas/panel-sync
env[KYBER_PANEL_APP_PATH] = /pruebas/
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = syslog
php_admin_value[open_basedir] = /opt/kyber/app-pruebas/sync:/opt/kyber/sync:/var/lib/kyber-panel-pruebas:/tmp
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec
php_admin_value[session.save_path] = /var/lib/kyber-panel-pruebas/sessions
php_admin_value[session.gc_maxlifetime] = 1800
php_admin_value[date.timezone] = America/Asuncion
