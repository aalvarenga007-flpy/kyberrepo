# Include ONLY inside the existing kyber.com.py HTTPS server.
# Production location / and its upstream remain unchanged.
location = /pruebas { return 302 https://kyber.com.py/pruebas/; }
location = /pruebas/healthz {
    access_log off;
    add_header Cache-Control "no-store" always;
    return 200 "kyber-pruebas-ok\n";
}
location ~ ^/pruebas/panel-sync/(?<panel_company>ekaru|ejapo)/(?<panel_page>entrar|index\.php|sync\.php|configuracion\.php)$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/kyber/app-pruebas/sync/gateway.php;
    fastcgi_param HTTPS on;
    fastcgi_param KYBER_PANEL_COMPANY $panel_company;
    fastcgi_param KYBER_PANEL_PAGE $panel_page;
    fastcgi_pass unix:/run/kyber-panel-pruebas/php.sock;
    fastcgi_read_timeout 60s;
    fastcgi_buffering off;
    access_log off;
    client_max_body_size 16k;
}
# The prefix is deliberately not ^~: the allowlisted PHP regex must match.
location /pruebas/panel-sync/ { return 404; }
location /pruebas/ {
    proxy_pass http://127.0.0.1:8503;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
