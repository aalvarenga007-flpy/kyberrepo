[Service]
Environment=KYBER_PANEL_STATE=/var/lib/kyber-panel-pruebas
Environment=KYBER_PANEL_URL=https://kyber.com.py/pruebas/panel-sync
# Explicit CLI option takes precedence over the existing server config.
ExecStart=
ExecStart=/opt/kyber/venv/bin/python -m streamlit run app.py --server.baseUrlPath=pruebas
ReadWritePaths=/var/lib/kyber-panel-pruebas
